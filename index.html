<script>
  // ── Base de datos en la nube (Firebase Realtime Database) ──
  // Todos los dispositivos que abran esta app y usen este mismo proyecto de
  // Firebase verán y editarán los mismos datos, en tiempo real.
  const firebaseConfig = {
    apiKey: "AIzaSyBo9N28RyazORtb-UIpLx4k9TsedYu874E",
    authDomain: "deli-lunch-5a358.firebaseapp.com",
    databaseURL: "https://deli-lunch-5a358-default-rtdb.firebaseio.com",
    projectId: "deli-lunch-5a358",
    storageBucket: "deli-lunch-5a358.firebasestorage.app",
    messagingSenderId: "1096222377340",
    appId: "1:1096222377340:web:6bb4af5e7d09ac56cdd0f9",
  };
  firebase.initializeApp(firebaseConfig);
  const firebaseDB = firebase.database();

  window.storage = {
    // Escucha cambios en vivo. onChange se llama cada vez que hay datos nuevos
    // (los propios o los de cualquier otro dispositivo conectado).
    subscribe(key, onChange, onError) {
      const ref = firebaseDB.ref(key);
      const listener = ref.on(
        "value",
        (snap) => onChange(snap.exists() ? { key, value: snap.val() } : null),
        (err) => onError && onError(err)
      );
      return () => ref.off("value", listener);
    },
    async set(key, value) {
      await firebaseDB.ref(key).set(value);
      return { key, value };
    },
  };
</script>

// Convierte un color hex ("#RRGGBB") a un arreglo [r,g,b] para usarlo con jsPDF
const hexRGB = (hex) => {
  const h = (hex || "#000000").replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
};

  ink: hexRGB(C.ink), ok: hexRGB(C.ok), white: [255, 255, 255], gray: [90, 82, 94], grayLight: [150, 138, 156],

};

// Ordena listas de grados de texto libre en orden natural (1, 2, 10... no alfabético)
const ordenarGrados = (lista) => [...lista].sort((a, b) => a.localeCompare(b, "es", { numeric: true, sensitivity: "base" }));

// Compara dos grados para ordenar; los vacíos ("sin grado") van al final
const compararGrado = (a, b) => {
  const ga = (a || "").trim(), gb = (b || "").trim();
  if (!ga && !gb) return 0;
  if (!ga) return 1;
  if (!gb) return -1;
  return ga.localeCompare(gb, "es", { numeric: true, sensitivity: "base" });
};

// Normaliza texto para comparar clientes: sin mayúsculas, acentos, espacios dobles ni símbolos de grado
const normalizarTexto = (t) => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const normalizarGrado = (g) => normalizarTexto(g).replace(/[°º.\-\s]/g, "").replace(/(grado|grupo)/g, "");

// Genera la clave única de cliente = nombre + grado.
// Si un registro NO tiene grado y ese nombre aparece con UN SOLO grado en la semana, se une a ese cliente;
// si el nombre existe en varios grados, el registro sin grado queda aparte (para no mezclar alumnos distintos).
const claveClienteFactory = (registros) => {
  const gradosPorNombre = {};
  registros.forEach((p) => {
    const n = normalizarTexto(p.nombre), g = normalizarGrado(p.grado);
    if (!n || !g) return;
    (gradosPorNombre[n] = gradosPorNombre[n] || new Set()).add(g);
  });
  return (p) => {
    const n = normalizarTexto(p.nombre);
    if (!n) return "";
    let g = normalizarGrado(p.grado);
    if (!g && gradosPorNombre[n] && gradosPorNombre[n].size === 1) g = [...gradosPorNombre[n]][0];
    return `${n}|${g}`;
  };
};

// La fuente del PDF (Helvetica) solo trae letras latinas: los emojis (🎉 🌮 ✓…) salen como "Ø<ß‰".
// Se quitan del texto antes de dibujarlo; los acentos y la ñ sí se conservan.
const limpiarTextoPDF = (t) => String(t ?? "")
  .replace(/✓/g, "")
  .replace(/[^\u0000-\u00FF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026]/g, "")
  .replace(/\s{2,}/g, " ")
  .trim();
const nuevoDocPDF = () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const textoOriginal = doc.text.bind(doc);
  const partirOriginal = doc.splitTextToSize.bind(doc);
  const anchoOriginal = doc.getTextWidth.bind(doc);
  doc.text = (texto, ...resto) => textoOriginal(Array.isArray(texto) ? texto.map(limpiarTextoPDF) : limpiarTextoPDF(texto), ...resto);
  doc.splitTextToSize = (texto, ...resto) => partirOriginal(limpiarTextoPDF(texto), ...resto);
  doc.getTextWidth = (texto) => anchoOriginal(limpiarTextoPDF(texto));
  return doc;
};

// Fechas del menú festivo: se guardan como "AAAA-MM-DD" (sin hora, para evitar desfases de zona horaria)
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const formatoFechaDia = (iso) => {

};
const formatoFechaCorta = (iso) => {

const festivoCantidadTotal = (p) =>
  p && p.platillos && Object.keys(p.platillos).length

  extras: { botellas: 0, litros: 0, postres: 0, lechitas: 0, jugos: 0, variosDesc: "", variosMonto: 0 },

  pagado: false,

function calcularResumenSemana(menuData, pedidosData, clubPreciosData, clubPedidosData, menuFestivoData = MENU_FESTIVO_INICIAL, festivoPedidosData = []) {
  const precioDe = (pkg) => (menuData.precios || {})[pkg] || 0;
  const descuentoPct = (menuData.precios || {}).descuentoAnticipado || 0;
  const comisionPct = (menuData.precios || {}).comisionTapToPay || 0;
  const factorAnticipado = (p) => (p.anticipado ? 1 - descuentoPct / 100 : 1);
  const factorTapToPay = (p) => (p.pago === "Tap to Pay" ? 1 + comisionPct / 100 : 1);
  const resumenDia = (d, gradoFiltro = null) => {
    let desayunos = 0, postres = 0, aguas = 0, ingreso = 0;
    pedidosData.forEach((p) => {
      if (gradoFiltro && (p.grado || "").trim() !== gradoFiltro) return;
      const pkg = p.dias[d];
      if (!pkg) return;
      if (pkg !== "agua") desayunos += p.qty;
      if (pkg === "postre" || pkg === "completo") postres += p.qty;
      if (pkg === "agua" || pkg === "completo") aguas += p.qty;
      ingreso += precioDe(pkg) * p.qty * factorAnticipado(p) * factorTapToPay(p);
    });
    return { desayunos, postres, aguas, ingreso: Math.round(ingreso) };
  };
  const extrasTot = pedidosData.reduce(
    (a, p) => ({
      botellas: a.botellas + (p.extras?.botellas || 0),
      litros: a.litros + (p.extras?.litros || 0),
      postres: a.postres + (p.extras?.postres || 0),
      lechitas: a.lechitas + (p.extras?.lechitas || 0),
      jugos: a.jugos + (p.extras?.jugos || 0),
      variosMonto: a.variosMonto + (p.extras?.variosMonto || 0),
    }),
    { botellas: 0, litros: 0, postres: 0, lechitas: 0, jugos: 0, variosMonto: 0 }
  );
  // Subtotal antes de la comisión de Tap to Pay (ya con el descuento por pago anticipado aplicado)
  const subtotalPedido = (p) => {
    let t = 0;
    DIAS.forEach(({ key }) => { if (p.dias[key]) t += precioDe(p.dias[key]) * p.qty; });
    t += (p.extras?.botellas || 0) * (menuData.precios?.aguaBotella || 0) + (p.extras?.litros || 0) * (menuData.precios?.agua1L || 0)
      + (p.extras?.postres || 0) * (menuData.precios?.soloPostre || 0)
      + (p.extras?.lechitas || 0) * (menuData.precios?.lechita || 0) + (p.extras?.jugos || 0) * (menuData.precios?.jugo500 || 0)
      + (p.extras?.variosMonto || 0);
    return t * factorAnticipado(p);
  };
  // Comisión de Tap to Pay: se le suma al cliente (no la absorbe el negocio)
  const comisionPedidoDe = (p) => (p.pago === "Tap to Pay" ? Math.round(subtotalPedido(p) * comisionPct / 100) : 0);
  const totalPedido = (p) => Math.round(subtotalPedido(p)) + comisionPedidoDe(p);
  const ingresoSemana = pedidosData.reduce((a, p) => a + totalPedido(p), 0);
  const porPago = pedidosData.reduce((a, p) => { a[p.pago] = (a[p.pago] || 0) + totalPedido(p); return a; }, {});
  const pendienteCobro = pedidosData.filter((p) => !p.pagado).reduce((a, p) => a + totalPedido(p), 0);

  const subtotalClub = (p) =>
    CLUB_ITEMS.reduce((t, it) => t + (p.items?.[it.key] || 0) * ((clubPreciosData || {})[it.key] || 0), 0);
  const comisionClubDe = (p) => (p.pago === "Tap to Pay" ? Math.round(subtotalClub(p) * comisionPct / 100) : 0);
  const totalClub = (p) => Math.round(subtotalClub(p)) + comisionClubDe(p);
  const clubCantidades = CLUB_ITEMS.reduce((acc, it) => {
    acc[it.key] = clubPedidosData.reduce((a, p) => a + (p.items?.[it.key] || 0), 0);
    return acc;
  }, {});
  const clubIngreso = clubPedidosData.reduce((a, p) => a + totalClub(p), 0);
  const clubPorPago = clubPedidosData.reduce((a, p) => { a[p.pago] = (a[p.pago] || 0) + totalClub(p); return a; }, {});
  const clubPendiente = clubPedidosData.filter((p) => !p.pagado).reduce((a, p) => a + totalClub(p), 0);

  const subtotalFestivo = (p) => (menuFestivoData?.precio || 0) * festivoCantidadTotal(p);
  const comisionFestivoDe = (p) => (p.pago === "Tap to Pay" ? Math.round(subtotalFestivo(p) * comisionPct / 100) : 0);
  const totalFestivo = (p) => Math.round(subtotalFestivo(p)) + comisionFestivoDe(p);
  const festivoIngreso = festivoPedidosData.reduce((a, p) => a + totalFestivo(p), 0);
  const festivoPorPago = festivoPedidosData.reduce((a, p) => { a[p.pago] = (a[p.pago] || 0) + totalFestivo(p); return a; }, {});
  const festivoRecaudado = festivoPedidosData.filter((p) => p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
  const festivoPendiente = festivoPedidosData.filter((p) => !p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
  // ── Conteo independiente de cada platillo festivo agregado ──
  const festivoNombresPlatillos = (menuFestivoData?.platillos || []).map((pl) => (pl || "").trim()).filter(Boolean);
  const festivoCantidades = festivoNombresPlatillos.reduce((acc, nombrePl) => {
    acc[nombrePl] = festivoPedidosData.reduce((a, p) => a + (p.platillos?.[nombrePl] || 0), 0);
    return acc;
  }, {});
  const recaudadoSemana = pedidosData.filter((p) => p.pagado).reduce((a, p) => a + totalPedido(p), 0);
  const clubRecaudado = clubPedidosData.filter((p) => p.pagado).reduce((a, p) => a + totalClub(p), 0);

  // ── Comisión de Tap to Pay ya incluida en los totales de arriba (se la cobra al cliente) ──
  const comisionSemana = pedidosData.reduce((a, p) => a + comisionPedidoDe(p), 0);
  const comisionClub = clubPedidosData.reduce((a, p) => a + comisionClubDe(p), 0);
  const comisionFestivo = festivoPedidosData.reduce((a, p) => a + comisionFestivoDe(p), 0);

  // ── Acumulados por grado (texto libre) ──
  const gradosOrdenados = ordenarGrados(Array.from(new Set([
    ...pedidosData.map((p) => (p.grado || "").trim()).filter(Boolean),
    ...clubPedidosData.map((p) => (p.grado || "").trim()).filter(Boolean),
    ...festivoPedidosData.map((p) => (p.grado || "").trim()).filter(Boolean),
  ])));
  const porGrado = gradosOrdenados.reduce((acc, gradoTxt) => {
    const propios = pedidosData.filter((p) => (p.grado || "").trim() === gradoTxt);
    const clubPropios = clubPedidosData.filter((p) => (p.grado || "").trim() === gradoTxt);
    const festivoPropios = festivoPedidosData.filter((p) => (p.grado || "").trim() === gradoTxt);
    const porDia = DIAS.reduce((accD, { key }) => {
      accD[key] = resumenDia(key, gradoTxt);
      return accD;
    }, {});
    const desayunos = propios.reduce((a, p) => a + DIAS.filter(({ key }) => p.dias[key] && p.dias[key] !== "agua").length * p.qty, 0);
    const ingreso = propios.reduce((a, p) => a + totalPedido(p), 0);
    const clubCantidadesG = CLUB_ITEMS.reduce((accI, it) => {
      accI[it.key] = clubPropios.reduce((a, p) => a + (p.items?.[it.key] || 0), 0);
      return accI;
    }, {});
    const clubIngresoG = clubPropios.reduce((a, p) => a + totalClub(p), 0);
    const festivoIngresoG = festivoPropios.reduce((a, p) => a + totalFestivo(p), 0);
    const festivoCantidadG = festivoPropios.reduce((a, p) => a + festivoCantidadTotal(p), 0);
    const festivoCantidadesG = festivoNombresPlatillos.reduce((accI, nombrePl) => {
      accI[nombrePl] = festivoPropios.reduce((a, p) => a + (p.platillos?.[nombrePl] || 0), 0);
      return accI;
    }, {});
    const recaudadoG = propios.filter((p) => p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubPropios.filter((p) => p.pagado).reduce((a, p) => a + totalClub(p), 0)
      + festivoPropios.filter((p) => p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
    const pendienteG = propios.filter((p) => !p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubPropios.filter((p) => !p.pagado).reduce((a, p) => a + totalClub(p), 0)
      + festivoPropios.filter((p) => !p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
    // Recaudado/pendiente SIN festivo (para el Resumen general, que no mezcla festivos)
    const recaudadoSinFestivoG = propios.filter((p) => p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubPropios.filter((p) => p.pagado).reduce((a, p) => a + totalClub(p), 0);
    const pendienteSinFestivoG = propios.filter((p) => !p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubPropios.filter((p) => !p.pagado).reduce((a, p) => a + totalClub(p), 0);
    acc[gradoTxt] = {
      pedidos: propios.length, desayunos, ingreso, porDia, recaudado: recaudadoG, pendiente: pendienteG,
      recaudadoSinFestivo: recaudadoSinFestivoG, pendienteSinFestivo: pendienteSinFestivoG,
      clubPedidos: clubPropios.length, clubIngreso: clubIngresoG, clubCantidades: clubCantidadesG,
      festivoPedidos: festivoPropios.length, festivoIngreso: festivoIngresoG, festivoCantidad: festivoCantidadG,
      festivoCantidades: festivoCantidadesG,
    };
    return acc;
  }, {});

  // ── Total por cliente: junta Pedidos (desayuno) + Club de Tareas SOLO cuando coinciden NOMBRE y GRADO ──
  // (hay alumnos con el mismo nombre en distintos grados; sin el grado se mezclaban sus cuentas)
  // También junta el Menú festivo, para que la nota de consumo salga con TODO lo del cliente
  const claveDe = claveClienteFactory([...pedidosData, ...clubPedidosData, ...festivoPedidosData]);
  const nombresClientes = Array.from(new Set([
    ...pedidosData.map(claveDe).filter(Boolean),
    ...clubPedidosData.map(claveDe).filter(Boolean),
    ...festivoPedidosData.map(claveDe).filter(Boolean),
  ]));
  const porCliente = nombresClientes.reduce((acc, clave) => {
    const pedidosCliente = pedidosData.filter((p) => claveDe(p) === clave);
    const clubCliente = clubPedidosData.filter((p) => claveDe(p) === clave);
    const festivoCliente = festivoPedidosData.filter((p) => claveDe(p) === clave);
    const nombreMostrar = (pedidosCliente[0]?.nombre || clubCliente[0]?.nombre || festivoCliente[0]?.nombre || clave).trim();
    const gradoMostrar = (pedidosCliente.find((p) => (p.grado || "").trim())?.grado
      || clubCliente.find((p) => (p.grado || "").trim())?.grado
      || festivoCliente.find((p) => (p.grado || "").trim())?.grado || "").trim();
    const totalPedidosC = pedidosCliente.reduce((a, p) => a + totalPedido(p), 0);
    const totalClubC = clubCliente.reduce((a, p) => a + totalClub(p), 0);
    const totalFestivoC = festivoCliente.reduce((a, p) => a + totalFestivo(p), 0);
    const recaudadoC = pedidosCliente.filter((p) => p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubCliente.filter((p) => p.pagado).reduce((a, p) => a + totalClub(p), 0)
      + festivoCliente.filter((p) => p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
    const pendienteFestivoC = festivoCliente.filter((p) => !p.pagado).reduce((a, p) => a + totalFestivo(p), 0);
    const pendienteC = pedidosCliente.filter((p) => !p.pagado).reduce((a, p) => a + totalPedido(p), 0)
      + clubCliente.filter((p) => !p.pagado).reduce((a, p) => a + totalClub(p), 0)
      + pendienteFestivoC;
    const fuentes = [pedidosCliente.length > 0, clubCliente.length > 0, festivoCliente.length > 0].filter(Boolean).length;
    acc[clave] = {
      nombre: nombreMostrar, grado: gradoMostrar,
      tienePedidos: pedidosCliente.length > 0, tieneClub: clubCliente.length > 0, tieneFestivo: festivoCliente.length > 0,
      coincide: fuentes > 1,
      totalPedidos: totalPedidosC, totalClub: totalClubC, totalFestivo: totalFestivoC,
      total: totalPedidosC + totalClubC + totalFestivoC,
      recaudado: recaudadoC, pendiente: pendienteC, pendienteFestivo: pendienteFestivoC,
    };
    return acc;
  }, {});
  // Orden: por grado (1°, 2°… y "sin grado" al final) y luego por nombre
  const clientesOrdenados = nombresClientes
    .sort((a, b) => compararGrado(porCliente[a].grado, porCliente[b].grado)
      || porCliente[a].nombre.localeCompare(porCliente[b].nombre, "es", { sensitivity: "base" }));

  return {
    precioDe, resumenDia, extrasTot, totalPedido, ingresoSemana, porPago, pendienteCobro, recaudadoSemana,
    totalClub, clubCantidades, clubIngreso, clubPorPago, clubPendiente, clubRecaudado, porGrado, gradosOrdenados,
    totalFestivo, festivoIngreso, festivoPorPago, festivoPendiente, festivoRecaudado, festivoCantidades, festivoNombresPlatillos,
    comisionPct, comisionSemana, comisionClub, comisionFestivo, comisionPedidoDe, comisionClubDe, comisionFestivoDe,
    porCliente, clientesOrdenados, claveDe,
  };
}

function DeliLunch() {
  const [vista, setVista] = useState("resumen");
  const [menu, setMenu] = useState(MENU_INICIAL);
  const [pedidos, setPedidos] = useState([]);
  const [clubPrecios, setClubPrecios] = useState(CLUB_PRECIOS_INICIAL);
  const [clubPedidos, setClubPedidos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [aviso, setAviso] = useState("");
  const [form, setForm] = useState(pedidoVacio());
  const [editando, setEditando] = useState(null);
  const [mostrarFormPedido, setMostrarFormPedido] = useState(false);
  const [filtroDia, setFiltroDia] = useState("todos");
  const [filtroGrado, setFiltroGrado] = useState("todos");
  const [filtroGradoFestivo, setFiltroGradoFestivo] = useState("todos");
  const [clubForm, setClubForm] = useState(clubPedidoVacio());
  const [clubEditando, setClubEditando] = useState(null);
  const [menuFestivo, setMenuFestivo] = useState(MENU_FESTIVO_INICIAL);
  const [festivoPedidos, setFestivoPedidos] = useState([]);
  const [festivoForm, setFestivoForm] = useState(festivoPedidoVacio());
  const [festivoEditando, setFestivoEditando] = useState(null);
  const [historial, setHistorial] = useState([]);
  const [semanaAbierta, setSemanaAbierta] = useState(null);
  const [tituloHist, setTituloHist] = useState(null); // texto en edición del nombre de una semana archivada
  const [conectado, setConectado] = useState(true);
  // Folios de las notas de consumo: consecutivo global + folio ya asignado a cada cliente en la semana actual
  const [folios, setFolios] = useState({ siguiente: 1, asignados: {} });
  // Estadística de ventas: vista semanal o mensual + periodo seleccionado
  const [modoEstad, setModoEstad] = useState("semanal");
  const [periodoSel, setPeriodoSel] = useState(null);

  // ── Cargar datos y mantenerse sincronizado en tiempo real con Firebase ──
  useEffect(() => {
    const unsubscribe = window.storage.subscribe(
      KEY,
      (r) => {
        if (r && r.value) {
          try {
            const d = JSON.parse(r.value);
            if (d.menu) setMenu({ ...d.menu, precios: { ...MENU_INICIAL.precios, ...d.menu.precios } });
            if (d.pedidos) setPedidos(d.pedidos);
            if (d.clubPrecios) setClubPrecios({ ...CLUB_PRECIOS_INICIAL, ...d.clubPrecios });
            if (d.clubPedidos) setClubPedidos(d.clubPedidos);
            if (d.historial) setHistorial(d.historial);
            if (d.menuFestivo) setMenuFestivo({ ...MENU_FESTIVO_INICIAL, ...d.menuFestivo });
            if (d.festivoPedidos) setFestivoPedidos(d.festivoPedidos);
            if (d.folios) setFolios({ siguiente: d.folios.siguiente || 1, asignados: d.folios.asignados || {} });
          } catch (e) {
            /* datos con formato inesperado: se ignoran */
          }
        }
        setConectado(true);
        setCargando(false);
      },
      () => {
        setConectado(false);
        setCargando(false);
      }
    );
    return unsubscribe;
  }, []);

  const guardar = async (nuevoMenu, nuevosPedidos, nuevoClubPrecios, nuevosClubPedidos, nuevoHistorial, nuevoMenuFestivo, nuevosFestivoPedidos, nuevosFolios) => {
    const m = nuevoMenu ?? menu;
    const p = nuevosPedidos ?? pedidos;
    const cp = nuevoClubPrecios ?? clubPrecios;
    const cped = nuevosClubPedidos ?? clubPedidos;
    const hist = nuevoHistorial ?? historial;
    const mf = nuevoMenuFestivo ?? menuFestivo;
    const fp = nuevosFestivoPedidos ?? festivoPedidos;
    const fol = nuevosFolios ?? folios;
    setMenu(m);
    setPedidos(p);
    setClubPrecios(cp);
    setClubPedidos(cped);
    setHistorial(hist);
    setMenuFestivo(mf);
    setFestivoPedidos(fp);
    setFolios(fol);
    try {
      await window.storage.set(KEY, JSON.stringify({ menu: m, pedidos: p, clubPrecios: cp, clubPedidos: cped, historial: hist, menuFestivo: mf, festivoPedidos: fp, folios: fol }));
      setConectado(true);
      setAviso("Guardado ✓");
      setTimeout(() => setAviso(""), 1500);
    } catch (e) {
      setConectado(false);
      setAviso("Sin conexión: no se pudo guardar en la nube");
      setTimeout(() => setAviso(""), 3000);
    }
  };

  // ── Cálculos del resumen (semana actual) ──
  const calc = calcularResumenSemana(menu, pedidos, clubPrecios, clubPedidos, menuFestivo, festivoPedidos);
  const {
    precioDe, resumenDia, extrasTot, totalPedido, ingresoSemana, porPago, pendienteCobro, recaudadoSemana,
    totalClub, clubCantidades, clubIngreso, clubPorPago, clubPendiente, clubRecaudado, porGrado, gradosOrdenados,
    totalFestivo, festivoIngreso, festivoPorPago, festivoPendiente, festivoRecaudado, festivoCantidades, festivoNombresPlatillos,
    comisionPct, comisionSemana, comisionClub, comisionFestivo, comisionPedidoDe, comisionClubDe, comisionFestivoDe,
    porCliente, clientesOrdenados, claveDe,
  } = calc;

  // ── Copiar resumen del día para WhatsApp ──
  const textoDia = (key) => {
    const r = resumenDia(key);
    const label = DIAS.find((x) => x.key === key).label;
    const lineas = [
      `🍳 *Deli-Lunch · ${key === "mar" ? "Martes de tacos 🌮" : label}*`,
      `${menu.platillos[key].plato}`,
      ``,
      `Para cocinar hoy:`,
      `• ${r.desayunos} desayunos`,
      `• ${r.postres} postres (${menu.platillos[key].postre})`,
      `• ${r.aguas} aguas (${menu.platillos[key].bebida})`,
    ];
    lineas.push(``, `Pedidos:`);
    pedidos
      .filter((p) => p.dias[key])
      .forEach((p) => {
        const pq = PAQUETES_TODOS.find((q) => q.key === p.dias[key])?.label || "";
        lineas.push(
          `• ${p.nombre}${p.qty > 1 ? ` x${p.qty}` : ""} · ${pq}` +
          (p.pagado ? " ✓ pagado" : ` · por cobrar (${p.pago.toLowerCase()})`)
        );
      });
    lineas.push(``, `💰 Ingreso del día: $${r.ingreso}`);
    return lineas.join("\n");
  };

  const copiarDia = async (key) => {
    const texto = textoDia(key);
    try {
      await navigator.clipboard.writeText(texto);
      setAviso("Resumen copiado ✓ pégalo en WhatsApp");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        setAviso("Resumen copiado ✓ pégalo en WhatsApp");
      } catch (e2) {
        setAviso("No se pudo copiar en este dispositivo");
      }
      document.body.removeChild(ta);
    }
    setTimeout(() => setAviso(""), 2500);
  };

  // ── Utilidades visuales compartidas para los PDF (colores y bloques con estilo Deli-Lunch) ──
  const crearContextoPDF = () => {
    const doc = nuevoDocPDF();
    const margen = 40;
    const anchoPagina = doc.internal.pageSize.getWidth();
    const altoPagina = doc.internal.pageSize.getHeight();
    const anchoUtil = anchoPagina - margen * 2;
    const ref = { y: 50 };
    const setColor = (rgb) => doc.setTextColor(rgb[0], rgb[1], rgb[2]);
    const setFill = (rgb) => doc.setFillColor(rgb[0], rgb[1], rgb[2]);
    const setDraw = (rgb) => doc.setDrawColor(rgb[0], rgb[1], rgb[2]);
    const salto = (extra = 18) => {
      ref.y += extra;
      if (ref.y > altoPagina - 60) { doc.addPage(); ref.y = 50; }
    };

    // Encabezado con banda de color Deli-Lunch
    const encabezado = (titulo, subIzq = "", subDer = "") => {
      setFill(RGB.plum);
      doc.rect(0, 0, anchoPagina, 96, "F");
      setFill(RGB.lavender);
      doc.rect(0, 96, anchoPagina, 4, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(24); setColor(RGB.white);
      doc.text("Deli-Lunch", margen, 46);
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); setColor(RGB.pinkSoft);
      doc.text(titulo, margen, 68);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); setColor(RGB.white);
      if (subIzq) doc.text(subIzq, margen, 86);
      if (subDer) doc.text(subDer, anchoPagina - margen, 86, { align: "right" });
      ref.y = 124;
    };

    // Título de sección con "píldora" de color
    const tituloSeccion = (texto, colorRGB = RGB.plum) => {
      if (ref.y + 26 > altoPagina - 60) { doc.addPage(); ref.y = 50; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(10);
      const anchoTexto = doc.getTextWidth(texto.toUpperCase());
      setFill(colorRGB);
      doc.roundedRect(margen, ref.y - 13, anchoTexto + 20, 20, 6, 6, "F");
      setColor(RGB.white);
      doc.text(texto.toUpperCase(), margen + 10, ref.y + 1);
      ref.y += 22;
    };

    // Línea de texto simple (con salto de línea automático si es muy larga)
    const filaTexto = (texto, opts = {}) => {
      const { bold = false, size = 10, color = RGB.gray, indent = 0 } = opts;
      doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); setColor(color);
      const lineas = doc.splitTextToSize(texto, anchoUtil - indent);
      if (ref.y + lineas.length * (size + 4) > altoPagina - 60) { doc.addPage(); ref.y = 50; }
      doc.text(lineas, margen + indent, ref.y);
      ref.y += lineas.length * (size + 4);
    };

    // Tarjeta de total con fondo de color (estilo de las tarjetas de la app)
    const cajaTotal = (titulo, monto, chips = [], colorRGB = RGB.plum) => {
      const alturaCaja = chips.length ? 70 : 52;
      if (ref.y + alturaCaja > altoPagina - 50) { doc.addPage(); ref.y = 50; }
      setFill(colorRGB);
      doc.roundedRect(margen, ref.y, anchoUtil, alturaCaja, 10, 10, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); setColor(RGB.white);
      doc.text(titulo, margen + 16, ref.y + 22);
      doc.setFont("helvetica", "bold"); doc.setFontSize(20);
      doc.text(`$${monto}`, margen + 16, ref.y + 44);
      if (chips.length) {
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
        doc.text(chips.join("   ·   "), margen + 16, ref.y + 60);
      }
      ref.y += alturaCaja + 16;
    };

    // Tarjeta clara con borde suave (para pedidos individuales o grupos)
    const tarjetaClara = (dibujar, alturaCaja) => {
      if (ref.y + alturaCaja > altoPagina - 50) { doc.addPage(); ref.y = 50; }
      setFill(RGB.cream); setDraw(RGB.lavSoft); doc.setLineWidth(1);
      doc.roundedRect(margen, ref.y, anchoUtil, alturaCaja, 8, 8, "FD");
      dibujar(ref.y);
      ref.y += alturaCaja + 10;
    };

    const piePagina = () => {
      const totalPaginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i);
        setColor(RGB.grayLight);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8);
        doc.text(`Deli-Lunch · página ${i} de ${totalPaginas}`, anchoPagina / 2, altoPagina - 24, { align: "center" });
      }
    };

    return {
      doc, margen, anchoPagina, altoPagina, anchoUtil, ref, salto, setColor, setFill, setDraw,
      encabezado, tituloSeccion, filaTexto, cajaTotal, tarjetaClara, piePagina,
    };
  };

  // ── Descargar resumen semanal en PDF (semana actual o archivada) ──
  const descargarPDF = (menuData = menu, calcData = calc, clubPedidosData = clubPedidos, subtitulo = "", festivoPedidosData = festivoPedidos, menuFestivoData = menuFestivo) => {
    const { doc, margen, anchoPagina, altoPagina, anchoUtil, ref, setColor, setFill, setDraw, encabezado, tituloSeccion, filaTexto, cajaTotal, piePagina } = crearContextoPDF();

    encabezado(`Resumen semanal${subtitulo}`, menuData.semana, `Generado el ${new Date().toLocaleDateString("es-MX")}`);

    // ── Desayunos ──
    tituloSeccion("Desayunos", RGB.plum);
    DIAS.forEach(({ key, label }) => {
      const r = calcData.resumenDia(key);
      const esMartes = key === "mar";
      filaTexto(`${esMartes ? "Martes de tacos 🌮" : label} — ${menuData.platillos[key].plato}`, { bold: true, size: 11, color: RGB.ink });
      let linea1 = `${r.desayunos} desayunos · ${r.postres} postres · ${r.aguas} aguas`;
      linea1 += ` · Ingreso: $${r.ingreso}`;
      filaTexto(linea1, { indent: 10 });
      ref.y += 4;
    });
    const extrasTotData = calcData.extrasTot;
    if (extrasTotData.botellas || extrasTotData.litros || extrasTotData.postres || extrasTotData.lechitas || extrasTotData.jugos || extrasTotData.variosMonto) {
      let lineaExtras = `Extras: ${extrasTotData.botellas} agua embotellada · ${extrasTotData.litros} agua 1L · ${extrasTotData.postres} solo postre · ${extrasTotData.lechitas} lechita · ${extrasTotData.jugos} jugo 500ml`;
      if (extrasTotData.variosMonto) lineaExtras += ` · Varios: $${extrasTotData.variosMonto}`;
      filaTexto(lineaExtras);
      ref.y += 4;
    }
    ref.y += 4;
    cajaTotal("Ingreso desayuno", calcData.ingresoSemana, [
      `Recaudado $${calcData.recaudadoSemana}`, `Efectivo $${calcData.porPago["Efectivo"] || 0}`,
      `Transferencia $${calcData.porPago["Transferencia"] || 0}`, `Tap to Pay $${calcData.porPago["Tap to Pay"] || 0}`,
      `Por cobrar $${calcData.pendienteCobro}`,
    ], RGB.plum);
    if (calcData.comisionSemana > 0) filaTexto(`Incluye $${calcData.comisionSemana} de comisión Tap to Pay (${calcData.comisionPct}%) cobrada al cliente`, { color: RGB.gray });

    // ── Club de Tareas ──
    tituloSeccion("Club de Tareas", RGB.mustard);
    if (clubPedidosData.length === 0) {
      filaTexto("Sin pedidos esta semana.");
      ref.y += 10;
    } else {
      CLUB_ITEMS.forEach((it) => {
        if (calcData.clubCantidades[it.key] > 0) filaTexto(`• ${it.label}: ${calcData.clubCantidades[it.key]}`, { indent: 10 });
      });
      ref.y += 4;
      cajaTotal("Ingreso Club de Tareas", calcData.clubIngreso, [
        `Recaudado $${calcData.clubRecaudado}`, `Efectivo $${calcData.clubPorPago["Efectivo"] || 0}`,
        `Transferencia $${calcData.clubPorPago["Transferencia"] || 0}`, `Tap to Pay $${calcData.clubPorPago["Tap to Pay"] || 0}`,
        `Por cobrar $${calcData.clubPendiente}`,
      ], RGB.mustard);
      if (calcData.comisionClub > 0) filaTexto(`Incluye $${calcData.comisionClub} de comisión Tap to Pay (${calcData.comisionPct}%) cobrada al cliente`, { color: RGB.gray });
    }

    // ── Menú festivo ──
    if (festivoPedidosData.length > 0) {
      tituloSeccion(`Menú festivo — ${menuFestivoData.nombre || ""}`, RGB.lavender);
      if (menuFestivoData.fecha) filaTexto(`Entrega: ${formatoFechaCorta(menuFestivoData.fecha)}`, { indent: 10, color: RGB.ink });
      (calcData.festivoNombresPlatillos || []).forEach((nombrePl) => {
        if (calcData.festivoCantidades?.[nombrePl] > 0) filaTexto(`• ${nombrePl}: ${calcData.festivoCantidades[nombrePl]}`, { indent: 10 });
      });
      const totalMenus = festivoPedidosData.reduce((a, p) => a + festivoCantidadTotal(p), 0);
      filaTexto(`Total: ${totalMenus} menú(s) a $${menuFestivoData.precio || 0} c/u`, { indent: 10, bold: true, color: RGB.ink });
      ref.y += 4;
      cajaTotal("Ingreso Menú festivo", calcData.festivoIngreso, [
        `Recaudado $${calcData.festivoRecaudado}`, `Efectivo $${calcData.festivoPorPago["Efectivo"] || 0}`,
        `Transferencia $${calcData.festivoPorPago["Transferencia"] || 0}`, `Tap to Pay $${calcData.festivoPorPago["Tap to Pay"] || 0}`,
        `Por cobrar $${calcData.festivoPendiente}`,
      ], RGB.lavender);
      if (calcData.comisionFestivo > 0) filaTexto(`Incluye $${calcData.comisionFestivo} de comisión Tap to Pay (${calcData.comisionPct}%) cobrada al cliente`, { color: RGB.gray });
    }

    // ── Por grado ──
    const gradosConDatos = calcData.gradosOrdenados;
    if (gradosConDatos.length > 0) {
      tituloSeccion("Por grado", RGB.tealOscuro);
      gradosConDatos.forEach((gradoTxt) => {
        const pg = calcData.porGrado[gradoTxt];
        const lineasExtra = [];
        const porDiaTxt = DIAS.filter(({ key }) => pg.porDia[key].desayunos > 0)
          .map(({ key, label }) => `${label.slice(0, 3)}: ${pg.porDia[key].desayunos}`).join(" · ");
        if (porDiaTxt) lineasExtra.push(`Desayunos — ${porDiaTxt}`);
        const clubTxt = CLUB_ITEMS.filter((it) => pg.clubCantidades[it.key] > 0)
          .map((it) => `${pg.clubCantidades[it.key]} ${it.label}`).join(" · ");
        if (clubTxt) lineasExtra.push(`Club de Tareas — ${clubTxt}`);
        if (pg.festivoPedidos > 0) {
          const festTxt = (calcData.festivoNombresPlatillos || []).filter((n) => pg.festivoCantidades?.[n] > 0)
            .map((n) => `${pg.festivoCantidades[n]} ${n}`).join(" · ") || `${pg.festivoCantidad} menú(s)`;
          lineasExtra.push(`Menú festivo — ${festTxt}`);
        }
        const lineasEnvueltas = lineasExtra.map((t) => doc.splitTextToSize(t, anchoUtil - 24));
        const alturaExtra = lineasEnvueltas.reduce((a, ls) => a + ls.length * 12, 0);
        const alturaCaja = 46 + alturaExtra;
        if (ref.y + alturaCaja > altoPagina - 50) { doc.addPage(); ref.y = 50; }
        setFill(RGB.cream); setDraw(RGB.lavSoft); doc.setLineWidth(1);
        doc.roundedRect(margen, ref.y, anchoUtil, alturaCaja, 8, 8, "FD");
        let yy = ref.y + 18;
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); setColor(RGB.ink);
        doc.text(gradoTxt, margen + 12, yy);
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); setColor(RGB.plum);
        doc.text(`$${pg.ingreso + pg.clubIngreso + pg.festivoIngreso}`, anchoPagina - margen - 12, yy, { align: "right" });
        yy += 16;
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); setColor(RGB.ok);
        doc.text(`Recaudado $${pg.recaudado}`, margen + 12, yy);
        setColor(RGB.pinkOscuro);
        doc.text(`Por cobrar $${pg.pendiente}`, margen + 150, yy);
        yy += 16;
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); setColor(RGB.gray);
        lineasEnvueltas.forEach((ls) => { doc.text(ls, margen + 12, yy); yy += ls.length * 12; });
        ref.y += alturaCaja + 10;
      });
    }

    // ── Total general ──

        document.fonts.load("800 16px Nunito"),
        document.fonts.load("400 15px Nunito"),
      ]);
    } catch (e) { /* si no cargan, se usa la fuente de respaldo */ }

    const ancho = 900;
    const pad = 44;
    const anchoInterno = ancho - pad * 2;
    const bordeCampo = "#E4D3E8";
    const colorLabel = "#B9A6C2";

    // Parte un texto en líneas que quepan en maxWidth (sin dibujar todavía, solo para medir)
    const partirLineas = (ctx, texto, maxWidth) => {
      const palabras = (texto || "").split(" ").filter(Boolean);
      if (palabras.length === 0) return [""];
      const lineas = [];
      let actual = "";
      palabras.forEach((palabra) => {
        const prueba = actual ? `${actual} ${palabra}` : palabra;
        if (ctx.measureText(prueba).width > maxWidth && actual) {
          lineas.push(actual);
          actual = palabra;
        } else {
          actual = prueba;
        }
      });
      lineas.push(actual);
      return lineas;
    };

    // "Caja de campo" con una mini-etiqueta (Platillo/Postre/Bebida) y el valor en negritas junto a ella
    const medirCampoEtiquetado = (ctx, label, valor, wBox) => {
      const padX = 18, padY = 15, lineHeight = 26, gap = 10;
      ctx.font = "800 12px 'Nunito', sans-serif";
      const anchoLabel = ctx.measureText(label.toUpperCase()).width;
      ctx.font = "900 18px 'Nunito', sans-serif";
      const anchoPrimeraLinea = Math.max(40, wBox - padX * 2 - anchoLabel - gap);
      const anchoResto = wBox - padX * 2;
      const palabras = (valor || "").split(" ").filter(Boolean);
      const lineas = [];
      let actual = "";
      palabras.forEach((palabra, i) => {
        const prueba = actual ? `${actual} ${palabra}` : palabra;
        const maxAncho = lineas.length === 0 ? anchoPrimeraLinea : anchoResto;
        if (ctx.measureText(prueba).width > maxAncho && actual) {
          lineas.push(actual);
          actual = palabra;
        } else {
          actual = prueba;
        }
      });
      lineas.push(actual);
      const alto = padY * 2 + lineas.length * lineHeight;
      return { lineas, alto, padX, padY, lineHeight, gap, anchoLabel };
    };

    // Caja de campo grande sin etiqueta en línea (para "Nombre de la semana")
    const medirValor = (ctx, valor, wBox, fontSize) => {
      const padX = 20, padY = 16, lineHeight = fontSize + 8;
      ctx.font = `900 ${fontSize}px 'Nunito', sans-serif`;
      const lineas = partirLineas(ctx, valor, wBox - padX * 2);
      const alto = padY * 2 + lineas.length * lineHeight;
      return { lineas, alto, padX, padY, lineHeight };
    };

    // Contexto solo para medir (no se dibuja ni se agrega al DOM)
    const medidor = document.createElement("canvas").getContext("2d");

    const campoNombre = medirValor(medidor, menu.semana || "—", anchoInterno - 40, 22);

    const padCard = 22;
    const anchoDentroCard = anchoInterno - padCard * 2;
    const anchoMitad = (anchoDentroCard - 16) / 2;
    const barAltura = 42;
    const gapBarCampo = 16;
    const gapEntreCampos = 12;

    const diasCalc = DIAS.map(({ key, label }) => {
      const dia = menu.platillos[key] || { plato: "", postre: "", bebida: "" };
      const esMartes = key === "mar";
      const campoPlatillo = medirCampoEtiquetado(medidor, "Platillo", dia.plato, anchoDentroCard);
      const campoPostre = medirCampoEtiquetado(medidor, "Postre", dia.postre, anchoMitad);
      const campoBebida = medirCampoEtiquetado(medidor, "Bebida", dia.bebida, anchoMitad);
      const altoInferior = Math.max(campoPostre.alto, campoBebida.alto);
      const altoCard = barAltura + gapBarCampo + campoPlatillo.alto + gapEntreCampos + altoInferior + padCard;
      return { key, label, esMartes, dia, campoPlatillo, campoPostre, campoBebida, altoInferior, altoCard };
    });

    const logoSize = 108;
    const alturaHeader = logoSize;
    const gapHeaderNombre = 26;
    const alturaNombreCard = 22 + 10 + campoNombre.alto + 24;
    const gapEntreCards = 18;
    const alturaFooter = 90;

    const alto = pad + alturaHeader + gapHeaderNombre + alturaNombreCard + gapEntreCards
      + diasCalc.reduce((a, d) => a + d.altoCard + gapEntreCards, 0)
      + alturaFooter + pad;

    // ── Canvas final, ya con el alto correcto ──
    const canvas = document.createElement("canvas");
    const escala = 2;
    canvas.width = ancho * escala;
    canvas.height = alto * escala;
    const ctx = canvas.getContext("2d");
    ctx.scale(escala, escala);
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = C.cream;
    ctx.fillRect(0, 0, ancho, alto);

    const cajaRedonda = (x, yc, w, h, r) => {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, yc, w, h, r); else ctx.rect(x, yc, w, h);
    };

    // ── Logo circular ──
    const cx = pad + logoSize / 2;
    const cy = pad + logoSize / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, logoSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#FCE7EF";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = C.pink;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = C.plum;
    ctx.font = "700 16px 'Pacifico', cursive";
    ctx.fillText("Deli-Lunch", cx, cy - 22);
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 15, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.plum;
    ctx.stroke();
    ctx.font = "900 13px 'Nunito', sans-serif";
    ctx.fillStyle = C.pink;
    ctx.fillText("♥", cx, cy + 9);
    ctx.font = "700 12px 'Pacifico', cursive";
    ctx.fillStyle = C.plum;
    ctx.fillText("Adriana Soto", cx, cy + 34);
    ctx.textAlign = "left";

    // ── Píldora de título ──
    const xPill = pad + logoSize + 24;
    const wPill = ancho - pad - xPill;
    cajaRedonda(xPill, pad, wPill, logoSize, 26);
    ctx.fillStyle = C.pinkSoft;
    ctx.fill();
    ctx.textAlign = "center";
    ctx.fillStyle = C.plum;
    ctx.font = "700 40px 'Pacifico', cursive";
    ctx.fillText("Menú Semanal", xPill + wPill / 2, pad + logoSize / 2 + 14);
    ctx.textAlign = "left";

    // ── Dibuja una caja de campo con etiqueta en línea (Platillo/Postre/Bebida) ──
    const dibujarCampoEtiquetado = (x, yc, w, label, campo) => {
      cajaRedonda(x, yc, w, campo.alto, 12);
      ctx.fillStyle = C.white;
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = bordeCampo;
      ctx.stroke();
      const yBase = yc + campo.padY + 13;
      ctx.font = "800 12px 'Nunito', sans-serif";
      ctx.fillStyle = colorLabel;
      ctx.fillText(label.toUpperCase(), x + campo.padX, yBase);
      ctx.font = "900 18px 'Nunito', sans-serif";
      ctx.fillStyle = C.ink;
      campo.lineas.forEach((linea, i) => {
        const xLinea = i === 0 ? x + campo.padX + campo.anchoLabel + campo.gap : x + campo.padX;
        ctx.fillText(linea, xLinea, yBase + i * campo.lineHeight);
      });
    };

    // ── Nombre de la semana ──
    let y = pad + alturaHeader + gapHeaderNombre;
    cajaRedonda(pad, y, anchoInterno, alturaNombreCard, 18);
    ctx.fillStyle = C.white;
    ctx.fill();
    ctx.font = "800 13px 'Nunito', sans-serif";
    ctx.fillStyle = C.plum;
    ctx.fillText("NOMBRE DE LA SEMANA", pad + 20, y + 26);
    const yCampoNombre = y + 40;
    cajaRedonda(pad + 20, yCampoNombre, anchoInterno - 40, campoNombre.alto, 12);
    ctx.fillStyle = C.white;
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = bordeCampo;
    ctx.stroke();
    ctx.font = "900 22px 'Nunito', sans-serif";
    ctx.fillStyle = C.ink;
    campoNombre.lineas.forEach((linea, i) => {
      ctx.fillText(linea, pad + 20 + campoNombre.padX, yCampoNombre + campoNombre.padY + 18 + i * campoNombre.lineHeight);
    });
    y += alturaNombreCard + gapEntreCards;

    // ── Tarjetas por día ──
    diasCalc.forEach((d) => {
      const xCard = pad;
      const wCard = anchoInterno;
      cajaRedonda(xCard, y, wCard, d.altoCard, 18);
      ctx.fillStyle = C.white;
      ctx.fill();

      // Barra superior de color (recortada a las esquinas redondeadas de la tarjeta)
      ctx.save();
      cajaRedonda(xCard, y, wCard, d.altoCard, 18);
      ctx.clip();
      ctx.fillStyle = d.esMartes ? C.mustard : C.pink;
      ctx.fillRect(xCard, y, wCard, barAltura);
      ctx.restore();

      ctx.font = "800 15px 'Nunito', sans-serif";
      ctx.fillStyle = d.esMartes ? C.white : C.ink;
      const etiqueta = d.esMartes ? "MARTES DE TACOS 🌮" : d.label.toUpperCase();
      ctx.fillText(etiqueta, xCard + padCard, y + barAltura / 2 + 5);

      let yCampo = y + barAltura + gapBarCampo;
      dibujarCampoEtiquetado(xCard + padCard, yCampo, anchoDentroCard, "Platillo", d.campoPlatillo);
      yCampo += d.campoPlatillo.alto + gapEntreCampos;

      dibujarCampoEtiquetado(xCard + padCard + anchoMitad + 16, yCampo, anchoMitad, "Bebida", d.campoBebida);

      y += d.altoCard + gapEntreCards;
    });

    // ── Pie: píldora "¡Gracias por su preferencia!" ──
    ctx.font = "700 24px 'Pacifico', cursive";
    const wFooterPill = ctx.measureText("¡Gracias por su preferencia!").width + 64;

    cajaRedonda(xFooterPill, yFooterPill, wFooterPill, 54, 22);
    ctx.fillStyle = C.pinkSoft;
    ctx.fill();
    ctx.textAlign = "center";
    ctx.fillStyle = C.ink;
    ctx.fillText("¡Gracias por su preferencia!", ancho / 2, yFooterPill + 35);
    ctx.textAlign = "left";

    const enlace = document.createElement("a");
    enlace.download = `Menu-DeliLunch-${menu.semana.replace(/\s+/g, "-")}.png`;
    enlace.href = canvas.toDataURL("image/png");

        {/* ══ CLUB DE TAREAS ══ */}

          <div style={{ display: "grid", gap: 14 }}>
            {!semanaAbierta ? (
              <>
                <h2 style={{ margin: "2px 0 0", fontSize: 17, fontWeight: 900, color: C.plum }}>Semanas anteriores 🗂️</h2>

                {historial.map((h) => {
                  const c = calcularResumenSemana(h.menu, h.pedidos, h.clubPrecios, h.clubPedidos, h.menuFestivo, h.festivoPedidos);
                  const pend = c.pendienteCobro + c.clubPendiente + c.festivoPendiente;
                  return (
                    <button key={h.id} onClick={() => { setSemanaAbierta(h.id); setTituloHist(null); }}

                        {pend > 0 ? ` · ⏳ por cobrar: $${pend}` : " · ✓ todo cobrado"}

                    </button>

              const c = calcularResumenSemana(h.menu, h.pedidos, h.clubPrecios, h.clubPedidos, h.menuFestivo, h.festivoPedidos);

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>

                    <div style={{ display: "flex", gap: 8 }}>

                        📄 PDF

                      {(h.festivoPedidos || []).length > 0 && (

                  ) : (
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4 }}>
                      <input style={{ ...inputS, flex: "1 1 220px" }} value={tituloHist} autoFocus
                        onChange={(e) => setTituloHist(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") renombrarSemanaHistorial(h.id, tituloHist); }} />
                      <button onClick={() => renombrarSemanaHistorial(h.id, tituloHist)} style={{ ...chip(true), padding: "10px 14px" }}>Guardar</button>
                      <button onClick={() => setTituloHist(null)} style={{ ...chip(false), padding: "10px 14px" }}>Cancelar</button>
                    </div>
                  )}

                  <div style={{ ...tarjeta, background: C.plum, color: C.white }}>
                    <div style={{ fontSize: 13, fontWeight: 700, opacity: 0.85 }}>Total de esa semana</div>
                    <div style={{ fontSize: 24, fontWeight: 900 }}>${c.ingresoSemana + c.clubIngreso + c.festivoIngreso}</div>
                    <div style={{ display: "flex", gap: 14, marginTop: 8, fontSize: 13, fontWeight: 700, flexWrap: "wrap" }}>
                      <span>✅ Recaudado: ${c.recaudadoSemana + c.clubRecaudado + c.festivoRecaudado}</span>
                      <span>⏳ Por cobrar: ${c.pendienteCobro + c.clubPendiente + c.festivoPendiente}</span>
                    </div>
                  </div>

                  <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Pedidos de desayuno</div>
                  {h.pedidos.length === 0 && <div style={{ ...tarjeta, color: "#8A7794", fontSize: 13 }}>Sin pedidos.</div>}
                  {h.pedidos.map((p) => (
                    <div key={p.id} style={tarjeta}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                        <div style={{ fontWeight: 900, fontSize: 14 }}>{p.nombre}{p.qty > 1 ? ` · x${p.qty}` : ""}</div>
                        <div style={{ fontWeight: 900, color: C.plum }}>${c.totalPedido(p)}</div>
                      </div>
                      <div style={{ fontSize: 12, color: "#8A7794", margin: "6px 0" }}>
                        {DIAS.filter(({ key }) => p.dias[key])
                          .map(({ key, label }) => `${label.slice(0, 3)}: ${PAQUETES_TODOS.find((q) => q.key === p.dias[key])?.label || "Agua embotellada 500ml"}`)
                          .join(" · ")}
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => toggleHistPagado(h.id, p.id)} style={chip(p.pagado, C.ok)}>
                          {p.pagado ? "✓ Pagado" : "Marcar pagado"}
                        </button>
                        <button onClick={() => borrarHistPedido(h.id, p.id)} style={{ ...chip(false), color: "#B0486B", borderColor: "#EFC5D2" }}>Borrar</button>
                      </div>
                    </div>
                  ))}

                  <div style={{ fontSize: 13, fontWeight: 800, color: C.plum, marginTop: 6 }}>Pedidos Club de Tareas</div>
                  {h.clubPedidos.length === 0 && <div style={{ ...tarjeta, color: "#8A7794", fontSize: 13 }}>Sin pedidos.</div>}
                  {h.clubPedidos.map((p) => (
                    <div key={p.id} style={tarjeta}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                        <div style={{ fontWeight: 900, fontSize: 14 }}>{p.nombre}</div>
                        <div style={{ fontWeight: 900, color: C.plum }}>${c.totalClub(p)}</div>
                      </div>
                      <div style={{ fontSize: 12, color: "#8A7794", margin: "6px 0" }}>
                        {CLUB_ITEMS.filter((it) => p.items?.[it.key] > 0).map((it) => `${p.items[it.key]} ${it.label}`).join(" · ")}
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => toggleHistPagadoClub(h.id, p.id)} style={chip(p.pagado, C.ok)}>
                          {p.pagado ? "✓ Pagado" : "Marcar pagado"}
                        </button>
                        <button onClick={() => borrarHistClubPedido(h.id, p.id)} style={{ ...chip(false), color: "#B0486B", borderColor: "#EFC5D2" }}>Borrar</button>
                      </div>
                    </div>
                  ))}

                  <div style={{ fontSize: 13, fontWeight: 800, color: C.plum, marginTop: 6 }}>
                    Pedidos Menú festivo{(h.festivoPedidos || []).length > 0 && h.menuFestivo?.nombre ? ` · ${h.menuFestivo.nombre}` : ""}
                    {(h.festivoPedidos || []).length > 0 && h.menuFestivo?.fecha ? ` (${formatoFechaCorta(h.menuFestivo.fecha)})` : ""}
                  </div>
                  {(h.festivoPedidos || []).length > 0 && (() => {
                    // Solo se puede mover a semanas que no tengan ya pedidos festivos (cada semana guarda un solo menú festivo)
                    const destinos = [
                      ...(festivoPedidos.length === 0 ? [{ id: "actual", nombre: `${menu.semana} (actual)` }] : []),
                      ...historial.filter((x) => x.id !== h.id && !(x.festivoPedidos || []).length).map((x) => ({ id: x.id, nombre: x.semana })),
                    ];
                    if (!destinos.length) return null;
                    return (
                      <div style={{ ...tarjeta, display: "grid", gap: 6, background: C.lavSoft }}>
                        <div style={{ fontSize: 12, color: "#6E5A78" }}>¿Estos festivos se entregaron en otra semana? Muévelos para que su ingreso se sume donde corresponde:</div>
                        <select style={inputS} value="" onChange={(e) => e.target.value && moverFestivoHistorial(h.id, e.target.value)}>
                          <option value="">Mover a la semana…</option>
                          {destinos.map((d) => <option key={d.id} value={d.id}>{d.nombre}</option>)}
                        </select>
                      </div>
                    );
                  })()}
                  {(h.festivoPedidos || []).length === 0 && <div style={{ ...tarjeta, color: "#8A7794", fontSize: 13 }}>Sin pedidos.</div>}
                  {(h.festivoPedidos || []).map((p) => (
                    <div key={p.id} style={tarjeta}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                        <div style={{ fontWeight: 900, fontSize: 14 }}>{p.nombre}</div>
                        <div style={{ fontWeight: 900, color: C.plum }}>${c.totalFestivo(p)}</div>
                      </div>
                      <div style={{ fontSize: 12, color: "#8A7794", margin: "6px 0" }}>
                        {p.platillos
                          ? Object.entries(p.platillos).filter(([, v]) => v > 0).map(([n, v]) => `${v} ${n}`).join(" · ")
                          : `x${p.qty || 1}`}
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => toggleHistPagadoFestivo(h.id, p.id)} style={chip(p.pagado, C.ok)}>
                          {p.pagado ? "✓ Pagado" : "Marcar pagado"}
                        </button>
                        <button onClick={() => borrarHistFestivoPedido(h.id, p.id)} style={{ ...chip(false), color: "#B0486B", borderColor: "#EFC5D2" }}>Borrar</button>
                      </div>
                    </div>
                  ))}

                  <button onClick={() => borrarSemanaHistorial(h.id)}
                    style={{ ...chip(false), color: "#B0486B", borderColor: "#EFC5D2", justifySelf: "start", marginTop: 6 }}>
                    Borrar esta semana del historial
                  </button>
                </>
              );
            })()}
          </div>
        )}

        {/* ══ ESTADÍSTICA DE VENTAS ══ */}
        {vista === "estadisticas" && (() => {
          // Cada semana (archivadas + la actual) con sus totales
          const semanasCronologicas = [
            ...[...historial].reverse().map((h) => ({ id: h.id, nombre: h.semana, fecha: new Date(h.cerrada), menu: h.menu, pedidos: h.pedidos || [], clubPrecios: h.clubPrecios, clubPedidos: h.clubPedidos || [], menuFestivo: h.menuFestivo || MENU_FESTIVO_INICIAL, festivoPedidos: h.festivoPedidos || [], actual: false })),
            { id: "actual", nombre: `${menu.semana} (actual)`, fecha: new Date(), menu, pedidos, clubPrecios, clubPedidos, menuFestivo, festivoPedidos, actual: true },
          ];
          const datosSemana = (s) => {
            const c = calcularResumenSemana(s.menu, s.pedidos, s.clubPrecios, s.clubPedidos, s.menuFestivo, s.festivoPedidos);
            const desayunos = DIAS.reduce((a, { key }) => a + c.resumenDia(key).desayunos, 0);
            const menusFestivo = s.festivoPedidos.reduce((a, p) => a + festivoCantidadTotal(p), 0);
            const clubPiezas = CLUB_ITEMS.reduce((a, it) => a + (c.clubCantidades[it.key] || 0), 0);
            return {
              desayuno: c.ingresoSemana, club: c.clubIngreso, festivo: c.festivoIngreso,
              total: c.ingresoSemana + c.clubIngreso + c.festivoIngreso,
              recaudado: c.recaudadoSemana + c.clubRecaudado + c.festivoRecaudado,
              pendiente: c.pendienteCobro + c.clubPendiente + c.festivoPendiente,
              efectivo: (c.porPago["Efectivo"] || 0) + (c.clubPorPago["Efectivo"] || 0) + (c.festivoPorPago["Efectivo"] || 0),
              transferencia: (c.porPago["Transferencia"] || 0) + (c.clubPorPago["Transferencia"] || 0) + (c.festivoPorPago["Transferencia"] || 0),
              tap: (c.porPago["Tap to Pay"] || 0) + (c.clubPorPago["Tap to Pay"] || 0) + (c.festivoPorPago["Tap to Pay"] || 0),
              desayunos, clubPiezas, menusFestivo,
              pedidos: s.pedidos.length + s.clubPedidos.length + s.festivoPedidos.length,
              clubCantidades: { ...c.clubCantidades },
            };
          };
          const sumar = (a, b) => {
            const r = { ...a };
            ["desayuno", "club", "festivo", "total", "recaudado", "pendiente", "efectivo", "transferencia", "tap", "desayunos", "clubPiezas", "menusFestivo", "pedidos"].forEach((k) => { r[k] = (a[k] || 0) + (b[k] || 0); });
            r.clubCantidades = { ...(a.clubCantidades || {}) };
            Object.entries(b.clubCantidades || {}).forEach(([k, v]) => { r.clubCantidades[k] = (r.clubCantidades[k] || 0) + v; });
            r.semanas = (a.semanas || 0) + 1;
            return r;
          };

          let periodos;
          if (modoEstad === "semanal") {
            periodos = semanasCronologicas.slice(-12).map((s) => ({
              id: s.id, etiqueta: s.nombre, corta: s.actual ? "Actual" : s.fecha.toLocaleDateString("es-MX", { day: "2-digit", month: "short" }),
              sub: s.actual ? "En curso" : `Cerrada el ${s.fecha.toLocaleDateString("es-MX")}`, datos: { ...datosSemana(s), semanas: 1 },
            }));
          } else {
            const porMes = {};
            semanasCronologicas.forEach((s) => {
              const clave = `${s.fecha.getFullYear()}-${String(s.fecha.getMonth() + 1).padStart(2, "0")}`;
              if (!porMes[clave]) porMes[clave] = { id: clave, fecha: s.fecha, datos: {} };
              porMes[clave].datos = sumar(porMes[clave].datos, datosSemana(s));
            });
            periodos = Object.keys(porMes).sort().slice(-12).map((k) => {
              const m = porMes[k];
              const nombreMes = m.fecha.toLocaleDateString("es-MX", { month: "long", year: "numeric" });
              return {
                id: k, etiqueta: nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1),
                corta: m.fecha.toLocaleDateString("es-MX", { month: "short" }).replace(".", ""),
                sub: `${m.datos.semanas} semana${m.datos.semanas === 1 ? "" : "s"}`, datos: m.datos,
              };
            });
          }

          const sel = periodos.find((p) => p.id === periodoSel) || periodos[periodos.length - 1];
          const idxSel = periodos.indexOf(sel);
          const anterior = idxSel > 0 ? periodos[idxSel - 1] : null;
          const maximo = Math.max(1, ...periodos.map((p) => p.datos.total));
          const promedio = periodos.length ? Math.round(periodos.reduce((a, p) => a + p.datos.total, 0) / periodos.length) : 0;
          const mejor = periodos.reduce((m, p) => (!m || p.datos.total > m.datos.total ? p : m), null);
          const variacion = anterior && anterior.datos.total > 0
            ? Math.round(((sel.datos.total - anterior.datos.total) / anterior.datos.total) * 100) : null;
          const unidad = modoEstad === "semanal" ? "semana" : "mes";
          const pct = (v) => (sel.datos.total > 0 ? Math.round((v / sel.datos.total) * 100) : 0);
          const topClub = CLUB_ITEMS.map((it) => ({ label: it.label, n: sel.datos.clubCantidades?.[it.key] || 0 }))
            .filter((x) => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 5);
          const colores = { desayuno: C.plum, club: C.mustard, festivo: C.lavender };

          return (
            <div style={{ display: "grid", gap: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <h2 style={{ margin: "2px 0 0", fontSize: 17, fontWeight: 900, color: C.plum }}>Estadística de ventas 📈</h2>
                <div style={{ display: "flex", gap: 6 }}>
                  <button style={chip(modoEstad === "semanal")} onClick={() => { setModoEstad("semanal"); setPeriodoSel(null); }}>Semanal</button>
                  <button style={chip(modoEstad === "mensual")} onClick={() => { setModoEstad("mensual"); setPeriodoSel(null); }}>Mensual</button>
                </div>
              </div>
              <div style={{ fontSize: 12, color: "#8A7794", marginTop: -8 }}>
                {modoEstad === "semanal"
                  ? "Últimas 12 semanas (las archivadas en 'Semanas' + la actual). Toca una barra para ver su detalle."
                  : "Cada semana se cuenta en el mes en que se cerró; la semana actual cuenta en el mes de hoy. Toca una barra para ver su detalle."}
              </div>

              {/* Tarjetas principales */}
              <div style={{ ...tarjeta, background: C.plum, color: C.white }}>
                <div style={{ fontSize: 13, fontWeight: 700, opacity: 0.85 }}>{sel.etiqueta}</div>
                <div style={{ fontSize: 28, fontWeight: 900 }}>${sel.datos.total}</div>
                <div style={{ display: "flex", gap: 14, marginTop: 6, fontSize: 13, fontWeight: 700, flexWrap: "wrap" }}>
                  <span>✅ Recaudado: ${sel.datos.recaudado}</span>
                  <span style={{ color: C.pink }}>⏳ Por cobrar: ${sel.datos.pendiente}</span>
                  {variacion !== null && (
                    <span style={{ background: "rgba(255,255,255,.18)", padding: "1px 8px", borderRadius: 999 }}>
                      {variacion >= 0 ? "▲" : "▼"} {Math.abs(variacion)}% vs {unidad} anterior
                    </span>
                  )}
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <div style={{ ...tarjeta, flex: "1 1 140px", padding: 12 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: "#8A7794" }}>Promedio por {unidad}</div>
                  <div style={{ fontSize: 20, fontWeight: 900, color: C.plum }}>${promedio}</div>
                </div>
                <div style={{ ...tarjeta, flex: "1 1 140px", padding: 12 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: "#8A7794" }}>Mejor {unidad}</div>
                  <div style={{ fontSize: 20, fontWeight: 900, color: C.plum }}>${mejor ? mejor.datos.total : 0}</div>
                  <div style={{ fontSize: 11, color: "#8A7794" }}>{mejor ? mejor.etiqueta : "—"}</div>
                </div>
                <div style={{ ...tarjeta, flex: "1 1 140px", padding: 12 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: "#8A7794" }}>Pedidos en el periodo</div>
                  <div style={{ fontSize: 20, fontWeight: 900, color: C.plum }}>{sel.datos.pedidos}</div>
                </div>
              </div>

              {/* Gráfica de barras apiladas */}
              <div style={tarjeta}>
                <div style={{ fontSize: 13, fontWeight: 800, color: C.plum, marginBottom: 10 }}>
                  Ventas por {unidad}
                </div>
                <div style={{ display: "flex", gap: 12, fontSize: 11, fontWeight: 700, color: "#6E5A78", marginBottom: 10, flexWrap: "wrap" }}>
                  <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: colores.desayuno, marginRight: 4 }} />Desayunos</span>
                  <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: colores.club, marginRight: 4 }} />Club de Tareas</span>
                  <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: colores.festivo, marginRight: 4 }} />Festivo</span>
                </div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 180, overflowX: "auto", paddingBottom: 2 }}>
                  {periodos.map((p) => {
                    const alto = (v) => `${(v / maximo) * 140}px`;
                    const activo = p.id === sel.id;
                    return (
                      <button key={p.id} onClick={() => setPeriodoSel(p.id)} title={`${p.etiqueta}: $${p.datos.total}`}
                        style={{ flex: "1 0 38px", maxWidth: 70, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%", background: activo ? C.lavSoft : "transparent", border: "none", borderRadius: 10, padding: "4px 2px", cursor: "pointer" }}>
                        <span style={{ fontSize: 10, fontWeight: 800, color: C.ink, marginBottom: 2 }}>${p.datos.total >= 1000 ? `${(p.datos.total / 1000).toFixed(1)}k` : p.datos.total}</span>
                        <div style={{ width: "70%", display: "flex", flexDirection: "column-reverse", borderRadius: 6, overflow: "hidden", minHeight: 2 }}>
                          <div style={{ height: alto(p.datos.desayuno), background: colores.desayuno }} />
                          <div style={{ height: alto(p.datos.club), background: colores.club }} />
                          <div style={{ height: alto(p.datos.festivo), background: colores.festivo }} />
                        </div>
                        <span style={{ fontSize: 10, fontWeight: activo ? 900 : 700, color: activo ? C.plum : "#8A7794", marginTop: 4, whiteSpace: "nowrap" }}>{p.corta}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Desglose del periodo seleccionado */}
              <div style={{ ...tarjeta, display: "grid", gap: 10 }}>
                <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Desglose · {sel.etiqueta} <span style={{ fontWeight: 700, color: "#8A7794" }}>({sel.sub})</span></div>
                {[
                  ["🍳 Desayunos", sel.datos.desayuno, colores.desayuno, `${sel.datos.desayunos} desayunos`],
                  ["🎒 Club de Tareas", sel.datos.club, colores.club, `${sel.datos.clubPiezas} artículos`],
                  ["🎉 Menú festivo", sel.datos.festivo, colores.festivo, `${sel.datos.menusFestivo} menús`],
                ].map(([t, v, col, det]) => (
                  <div key={t}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, fontWeight: 700 }}>
                      <span>{t} <span style={{ color: "#8A7794", fontWeight: 600 }}>· {det}</span></span>
                      <span style={{ fontWeight: 900, color: C.plum }}>${v} <span style={{ fontSize: 11, color: "#8A7794" }}>({pct(v)}%)</span></span>
                    </div>
                    <div style={{ height: 8, background: "#F1E9F4", borderRadius: 999, marginTop: 4 }}>
                      <div style={{ width: `${pct(v)}%`, height: "100%", background: col, borderRadius: 999 }} />
                    </div>
                  </div>
                ))}
                <div style={{ borderTop: "1px solid #EADFF2", paddingTop: 8, display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12, fontWeight: 800, color: "#6E5A78" }}>
                  <span>💵 Efectivo ${sel.datos.efectivo}</span>
                  <span>🏦 Transferencia ${sel.datos.transferencia}</span>
                  <span>💳 Tap to Pay ${sel.datos.tap}</span>
                </div>
              </div>

              {topClub.length > 0 && (
                <div style={{ ...tarjeta, display: "grid", gap: 6 }}>
                  <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Lo más vendido en Club de Tareas</div>
                  {topClub.map((x, i) => (
                    <div key={x.label} style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                      <span>{i + 1}. {x.label}</span>
                      <span style={{ fontWeight: 800, color: C.plum }}>{x.n}</span>
                    </div>
                  ))}
                </div>
              )}

              {historial.length === 0 && (
                <div style={{ ...tarjeta, textAlign: "center", color: "#8A7794", fontSize: 13 }}>
                  Por ahora solo se ve la semana actual. Cada vez que toques <b>Nueva semana</b>, la semana se archiva y se suma a esta estadística.
                </div>
              )}
            </div>
          );
        })()}

        {/* ══ MENÚ ══ */}
        {vista === "menu" && (
          <div style={{ display: "grid", gap: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <h2 style={{ margin: "2px 0 0", fontSize: 17, fontWeight: 900, color: C.plum }}>Menú de la semana ✏️</h2>
              <button onClick={descargarMenuPNG} style={{ ...chip(false), borderColor: C.mustard, color: "#9C6B14" }}>
                🖼️ Descargar menú (PNG, sin precios)
              </button>
            </div>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <label style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Nombre de la semana</label>
              <input style={inputS} value={menu.semana} onChange={(e) => setMenu({ ...menu, semana: e.target.value })} />
            </div>
            {DIAS.map(({ key, label }) => (
              <div key={key} style={{ ...tarjeta, display: "grid", gap: 8 }}>
                <span style={etiquetaDia(key)}>{key === "mar" ? "Martes de tacos" : label}</span>
                <input style={inputS} placeholder="Platillo" value={menu.platillos[key].plato}
                  onChange={(e) => setMenu({ ...menu, platillos: { ...menu.platillos, [key]: { ...menu.platillos[key], plato: e.target.value } } })} />
                <div style={{ display: "flex", gap: 8 }}>
                  <input style={inputS} placeholder="Postre" value={menu.platillos[key].postre}
                    onChange={(e) => setMenu({ ...menu, platillos: { ...menu.platillos, [key]: { ...menu.platillos[key], postre: e.target.value } } })} />
                  <input style={inputS} placeholder="Bebida" value={menu.platillos[key].bebida}
                    onChange={(e) => setMenu({ ...menu, platillos: { ...menu.platillos, [key]: { ...menu.platillos[key], bebida: e.target.value } } })} />
                </div>
              </div>
            ))}
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Precios</div>
              {[
                ["solo", "Solo desayuno"], ["postre", "Desayuno y postre"],
                ["completo", "Desayuno completo"], ["aguaBotella", "Agua embotellada 500 ml"], ["agua1L", "Agua 1 litro"], ["soloPostre", "Solo postre"],
                ["lechita", "Lechita"], ["jugo500", "Jugo 500 ml"],
              ].map(([k, t]) => (
                <div key={k} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ flex: 1, fontSize: 14 }}>{t}</span>
                  <span style={{ fontWeight: 800, color: C.plum }}>$</span>
                  <input type="number" style={{ ...inputS, width: 80 }} value={menu.precios[k]}
                    onChange={(e) => setMenu({ ...menu, precios: { ...menu.precios, [k]: Number(e.target.value) || 0 } })} />
                </div>
              ))}
            </div>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>💳 Comisión de Tap to Pay</div>
              <div style={{ fontSize: 12, color: "#8A7794" }}>
                Cuando eliges "Tap to Pay" como forma de pago en Pedidos, Club o Menú festivo, este porcentaje se suma automáticamente al total que le cobras al cliente, para cubrir la comisión bancaria.
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ flex: 1, fontSize: 14 }}>Comisión</span>
                <input type="number" min="0" max="100" step="0.1" style={{ ...inputS, width: 80 }} value={menu.precios.comisionTapToPay ?? 0}
                  onChange={(e) => setMenu({ ...menu, precios: { ...menu.precios, comisionTapToPay: Number(e.target.value) || 0 } })} />
                <span style={{ fontWeight: 800, color: C.plum }}>%</span>
              </div>
            </div>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>💳 Descuento por pago anticipado</div>
              <div style={{ fontSize: 12, color: "#8A7794" }}>
                Se aplica solo a los pedidos de desayuno semanal cuando marcas "Pago anticipado" al capturarlos.
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ flex: 1, fontSize: 14 }}>Descuento</span>
                <input type="number" min="0" max="100" style={{ ...inputS, width: 80 }} value={menu.precios.descuentoAnticipado ?? 0}
                  onChange={(e) => setMenu({ ...menu, precios: { ...menu.precios, descuentoAnticipado: Number(e.target.value) || 0 } })} />
                <span style={{ fontWeight: 800, color: C.plum }}>%</span>
              </div>
            </div>
            <button onClick={() => guardar(menu, null)} style={{ padding: "14px", borderRadius: 14, border: "none", background: C.plum, color: C.white, fontSize: 16, fontWeight: 900, cursor: "pointer" }}>
              Guardar menú
            </button>

            <h2 style={{ margin: "10px 0 0", fontSize: 17, fontWeight: 900, color: C.plum }}>🎒 Club de Tareas ✏️</h2>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Antojitos</div>
              {CLUB_ARTICULOS.map((it) => (
                <div key={it.key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ flex: 1, fontSize: 14 }}>{it.label}</span>
                  <span style={{ fontWeight: 800, color: C.plum }}>$</span>
                  <input type="number" style={{ ...inputS, width: 80 }} value={clubPrecios[it.key] ?? 0}
                    onChange={(e) => setClubPrecios({ ...clubPrecios, [it.key]: Number(e.target.value) || 0 })} />
                </div>
              ))}
            </div>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Bebidas</div>
              {CLUB_BEBIDAS.map((it) => (
                <div key={it.key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ flex: 1, fontSize: 14 }}>{it.label}</span>
                  <span style={{ fontWeight: 800, color: C.plum }}>$</span>
                  <input type="number" style={{ ...inputS, width: 80 }} value={clubPrecios[it.key] ?? 0}
                    onChange={(e) => setClubPrecios({ ...clubPrecios, [it.key]: Number(e.target.value) || 0 })} />
                </div>
              ))}
            </div>
            <div style={{ ...tarjeta, display: "grid", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: C.plum }}>Vaso 8oz</div>
              {CLUB_VASOS.map((it) => (
                <div key={it.key} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ flex: 1, fontSize: 14 }}>{it.label}</span>
                  <span style={{ fontWeight: 800, color: C.plum }}>$</span>
                  <input type="number" style={{ ...inputS, width: 80 }} value={clubPrecios[it.key] ?? 0}
                    onChange={(e) => setClubPrecios({ ...clubPrecios, [it.key]: Number(e.target.value) || 0 })} />
                </div>
              ))}
            </div>
            <button onClick={() => guardar(null, null, clubPrecios, null)} style={{ padding: "14px", borderRadius: 14, border: "none", background: C.mustard, color: C.white, fontSize: 16, fontWeight: 900, cursor: "pointer" }}>
              Guardar precios de Club de Tareas
            </button>
          </div>
        )}
      </main>

      {/* ── Navegación inferior ── */}
      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.white, borderTop: `3px solid ${C.pinkSoft}`, display: "flex", justifyContent: "flex-start", gap: 4, padding: "8px 6px 12px", zIndex: 40, overflowX: "auto" }}>
        {[
          ["menu", "🗒️", "Menú"],
          ["pedidos", "📋", "Pedidos"],
          ["club", "🎒", "Club"],
          ["resumen", "🍳", "Resumen"],
          ["general", "📊", "General"],
          ["festivo", "🎉", "Festivo"],
          ["estadisticas", "📈", "Ventas"],
          ["historial", "🗂️", "Semanas"],
        ].map(([v, ico, t]) => (
          <button key={v} onClick={() => setVista(v)}
            style={{
              flex: "0 0 auto", minWidth: 64, maxWidth: 120, padding: "8px 4px", borderRadius: 12, border: "none", cursor: "pointer",
              background: vista === v ? C.lavSoft : "transparent",
              color: vista === v ? C.plum : "#8A7794", fontWeight: 800, fontSize: 12,
            }}>
            <div style={{ fontSize: 18 }}>{ico}</div>
            {t}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ── Componentes pequeños ──
function Dato({ n, t, c }) {
  return (
    <div style={{ background: c + "33", border: `2px solid ${c}`, borderRadius: 12, padding: "6px 12px", minWidth: 74, textAlign: "center" }}>
      <div style={{ fontSize: 20, fontWeight: 900, color: "#3A2B3F" }}>{n}</div>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#6E5A78" }}>{t}</div>
    </div>
  );
}

function Contador({ label, value, onChange }) {
  const b = { width: 30, height: 30, borderRadius: 8, border: "2px solid #E9DCEF", background: "#FFF", fontWeight: 900, cursor: "pointer", color: "#8B1E5B" };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ fontSize: 13, fontWeight: 700 }}>{label}</span>
      <button style={b} onClick={() => onChange(Math.max(0, value - 1))}>−</button>
      <span style={{ fontWeight: 900, minWidth: 18, textAlign: "center" }}>{value}</span>
      <button style={b} onClick={() => onChange(value + 1)}>+</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DeliLunch />);
</script>
</body>
</html>
